name: CI/CD - Deploy to VPS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Syntax & Import Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config python3-dev

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cek syntax semua file Python
        run: |
          find . -name "*.py" \
            -not -path "./.git/*" \
            -not -path "./migrations/*" \
            | xargs python -m py_compile

      - name: Cek import utama aplikasi
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from app import create_app
          app = create_app()
          print('create_app() berhasil dijalankan')
          "
        env:
          SECRET_KEY: ci-test-secret-key-dummy
          DATABASE_URL: "sqlite:///:memory:"
          FLASK_ENV: testing

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Run deploy script on VPS
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd '${{ secrets.VPS_APP_DIR }}' && bash deployment/deploy.sh"
