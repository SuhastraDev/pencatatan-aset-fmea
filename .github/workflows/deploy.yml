name: CI/CD - Deploy to VPS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Syntax & Import Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config python3-dev

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cek syntax semua file Python
        run: |
          find . -name "*.py" \
            -not -path "./.git/*" \
            -not -path "./migrations/*" \
            | xargs python -m py_compile

      - name: Cek import utama aplikasi
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from app import create_app
          app = create_app()
          print('create_app() berhasil dijalankan')
          "
        env:
          SECRET_KEY: ci-test-secret-key-dummy
          DATABASE_URL: "sqlite:///:memory:"
          FLASK_ENV: testing

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Setup SSH key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          VPS_HOST_CLEAN="$(printf '%s' "$VPS_HOST" | tr -d '\r\n')"
          ssh-keyscan -H "$VPS_HOST_CLEAN" >> ~/.ssh/known_hosts

      - name: Run deploy script on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          VPS_HOST_CLEAN="$(printf '%s' "$VPS_HOST" | tr -d '\r\n')"
          VPS_USER_CLEAN="$(printf '%s' "$VPS_USER" | tr -d '\r\n')"
          VPS_APP_DIR_CLEAN="$(printf '%s' "$VPS_APP_DIR" | tr -d '\r\n')"
          ssh -i ~/.ssh/deploy_key "$VPS_USER_CLEAN@$VPS_HOST_CLEAN" \
            "cd '$VPS_APP_DIR_CLEAN' && bash deployment/deploy.sh"

      - name: Check production health
        run: curl --fail --head --max-time 20 https://simaset-rskgm.duckdns.org/login
